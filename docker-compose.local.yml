# Local Development Docker Compose
# This configuration includes PostgreSQL for development

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zippy-archon-postgres-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=zippy_archon
      - POSTGRES_USER=zippy
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zippy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Adminer (Database management UI)
  adminer:
    image: adminer:latest
    container_name: zippy-archon-adminer-local
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - app-network
    depends_on:
      - postgres
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local


