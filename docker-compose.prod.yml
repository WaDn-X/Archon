# Production Docker Compose Configuration for Zippy-Archon
# This configuration is optimized for production deployment with:
# - Security hardening
# - Monitoring and logging
# - High availability
# - Resource limits
# - Health checks
# - Rolling updates

version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: zippy-archon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zippy_archon
      POSTGRES_USER: zippy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zippy_user -d zippy_archon"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache (Production)
  redis:
    image: redis:7-alpine
    container_name: zippy-archon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Main Application Server (FastAPI)
  archon-server:
    build:
      context: ./python
      dockerfile: Dockerfile.server
      args:
        BUILDKIT_INLINE_CACHE: 1
        ENVIRONMENT: production
        ARCHON_SERVER_PORT: ${ARCHON_SERVER_PORT:-8181}
    container_name: zippy-archon-server
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      RELEASE_VERSION: ${RELEASE_VERSION:-1.0.0}
      LOG_LEVEL: INFO
      # Database
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      DATABASE_URL: postgresql://zippy_user:${POSTGRES_PASSWORD}@postgres:5432/zippy_archon
      # AI Providers
      XAI_API_KEY: ${XAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ZIPPY_API_KEY: ${ZIPPY_API_KEY}
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RATE_LIMIT_REQUESTS: 1000
      RATE_LIMIT_WINDOW: 60
      # Caching
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      # Services
      ARCHON_SERVER_PORT: 8181
      ARCHON_MCP_PORT: 8051
      ARCHON_AGENTS_PORT: 8052
      # Reverse Proxy
      BEHIND_PROXY: true
    ports:
      - "8181:8181"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8181/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.3

  # MCP Server (Model Context Protocol)
  archon-mcp:
    build:
      context: ./python
      dockerfile: Dockerfile.mcp
      args:
        BUILDKIT_INLINE_CACHE: 1
        ENVIRONMENT: production
    container_name: zippy-archon-mcp
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      RELEASE_VERSION: ${RELEASE_VERSION:-1.0.0}
      LOG_LEVEL: INFO
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      DATABASE_URL: postgresql://zippy_user:${POSTGRES_PASSWORD}@postgres:5432/zippy_archon
      XAI_API_KEY: ${XAI_API_KEY}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      API_SERVICE_URL: http://archon-server:8181
      AGENTS_SERVICE_URL: http://archon-agents:8052
      ARCHON_MCP_PORT: 8051
      ARCHON_SERVER_PORT: 8181
      ARCHON_AGENTS_PORT: 8052
      BEHIND_PROXY: true
    ports:
      - "8051:8051"
    networks:
      - app-network
    depends_on:
      archon-server:
        condition: service_healthy
      archon-agents:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8051)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # AI Agents Service
  archon-agents:
    build:
      context: ./python
      dockerfile: Dockerfile.agents
      args:
        BUILDKIT_INLINE_CACHE: 1
        ENVIRONMENT: production
    container_name: zippy-archon-agents
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      RELEASE_VERSION: ${RELEASE_VERSION:-1.0.0}
      LOG_LEVEL: INFO
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      DATABASE_URL: postgresql://zippy_user:${POSTGRES_PASSWORD}@postgres:5432/zippy_archon
      XAI_API_KEY: ${XAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ZIPPY_API_KEY: ${ZIPPY_API_KEY}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      ARCHON_AGENTS_PORT: 8052
      BEHIND_PROXY: true
    ports:
      - "8052:8052"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8052/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend Application
  archon-frontend:
    build:
      context: ./archon-ui-main
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: zippy-archon-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8181}
      VITE_ARCHON_SERVER_PORT: 8181
      NODE_ENV: production
    ports:
      - "${ARCHON_UI_PORT:-3737}:3737"
    networks:
      - app-network
    depends_on:
      archon-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3737"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zippy-archon-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8280}:${NGINX_PORT:-8280}"
      - "${NGINX_SSL_PORT:-8443}:${NGINX_SSL_PORT:-8443}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - app-network
    depends_on:
      - archon-server
      - archon-frontend
      - archon-mcp
      - archon-agents
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Monitoring Stack (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: zippy-archon-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  grafana:
    image: grafana/grafana:latest
    container_name: zippy-archon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Production deployment profiles
# Use: docker-compose -f docker-compose.prod.yml --profile monitoring up -d
profiles:
  - monitoring:
      services:
        - prometheus
        - grafana